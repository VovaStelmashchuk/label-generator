services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:22
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      # `mongo` is the compose service below, reachable over the container network.
      MONGO_URI: mongodb://root:example@mongo:27017/label-generator?authSource=admin
    depends_on:
      - mongo

  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: label-generator
    volumes:
      - mongodata:/data/db

volumes:
  mongodata:
