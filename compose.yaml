services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./certs:/certs
    depends_on:
      - app

  app:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - '3000:3000'
    env_file: .env
    environment:
      - POSTGRES_URI=postgresql://root:example@postgres:5432/label-generator
      # The dev compiler builds both the app router and the pages router (the
      # socket.io handler lives in pages/), which outgrew the VM's default heap
      # and got the container OOM-killed. Cap the heap so V8 collects instead.
      - NODE_OPTIONS=--max-old-space-size=2048
    depends_on:
      - postgres
    command: sh -c "npm install && npm run dev"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: label-generator
    volumes:
      - postgresdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    ports:
      - '8081:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - postgres

volumes:
  postgresdata:
